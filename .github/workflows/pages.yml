name: Deploy BxSites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install BoxLang
        run: |
          curl -fsSL https://install.boxlang.io/ | bash

      - name: Install BxSites
        run: install-bx-module bx-sites

      - name: Configure GitHub Pages base URL
        run: |
          sed -i 's|^baseURL: "/"|baseURL: "/ortus-ui/"|' bxsites.yaml

      - name: Build BxSites
        run: bxSites build

      - name: Deploy to GitHub Pages
        run: bxSites deploy --target=github-pages --branch=gh-pages --remote=origin