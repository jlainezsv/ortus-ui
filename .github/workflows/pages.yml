name: Deploy BxSites to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BoxLang
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: latest
          modules: bx-sites

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Configure GitHub Pages base URL
        run: |
          sed -i 's|^baseURL: "/"|baseURL: "/ortus-ui/"|' bxsites.yaml

      - name: Build BxSites
        run: bxSites build

      - name: Verify base path in output
        run: |
          grep -q 'href="/ortus-ui/boxlang/index.html"' site/index.html \
            && echo "OK: base path present" \
            || { echo "FAIL: base path missing from site/index.html"; exit 1; }

      - name: Deploy to GitHub Pages
        run: bxSites deploy --target=github-pages --branch=gh-pages --remote=origin
        